# Pipeline configuration (no secrets)
project:
  name: retail-sales-pipeline
  timezone: UTC

paths:
  raw: data/raw
  bronze: data/bronze
  silver: data/silver
  gold: data/gold

ingest:
  source_system: retail_ops
  tables:
    - stores
    - products
    - customers
    - sales_transactions

quality:
  fail_on_error: true
  allowed_channels:
    - in_store
    - online
    - mobile_app
  allowed_payment_methods:
    - credit_card
    - debit_card
    - cash
    - mobile_pay
    - gift_card

gold_marts:
  - mart_daily_sales_by_store
  - mart_daily_sales_by_category
  - mart_customer_lifetime_value
  - mart_product_performance
  - mart_channel_mix

spark:
  master: local[*]
  shuffle_partitions: 4
  driver_memory: 2g

airflow:
  dag_id: retail_sales_medallion_pipeline
  schedule: "0 6 * * *"

api_source:
  # Fake Store API — no API key required
  base_url: https://fakestoreapi.com
  products_path: /products
  carts_path: /carts
  users_path: /users
  timeout: 20
  retries: 3
  fetch_carts: true
  fetch_users: true

api_sink:
  # Local FastAPI sink (src/sinks/http_sink_server.py) + optional JSONPlaceholder
  local_url: http://127.0.0.1:8089/ingest
  external_url: https://jsonplaceholder.typicode.com/posts
  timeout: 20
  retries: 3
  post_local: true
  post_external: true
